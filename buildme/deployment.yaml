apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildme
  labels:
    app: buildme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildme
  template:
    metadata:
      labels:
        app: buildme
    spec:
      containers:
      - name: buildme
        image: docker.io/opsmx11/dev-buildme-demo:10-nocritical
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
