apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildme
  labels:
    app: buildme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildme
  template:
    metadata:
      labels:
        app: buildme
    spec:
      initContainers:
      - name: api-validation
        image: curlimages/curl:8.12.1
        env:
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: api-validation-secret
              key: TOKEN        
        - name: ARTIFACT_TAG
          value: "10-nocritical"
        command:
        - sh
        - -c
        - |
          while true; do
            RESPONSE=$(curl --location \
              --silent \
              --output /tmp/response.json \
              --write-out "%{http_code}" \
              "https://ssd.ssd-demo.opsmx.net/webhook/api/v1/datacollection" \
              --header "X-OpsMx-Auth: $TOKEN" \
              --header "Content-Type: application/json" \
              --data "{
                \"organizationName\": \"opsmx\",
                \"artifactName\": \"$ARTIFACT_NAME\",
                \"artifactTag\": \"$ARTIFACT_TAG\"
              }")

            echo "API Status: $RESPONSE"

            if [ "$RESPONSE" = "201" ] || [ "$RESPONSE" = "208" ]; then
              echo "Status is $RESPONSE. Retrying after 15 seconds..."
              sleep 15
            else
              echo "Status is $RESPONSE. Stopping retries."
              echo "API Response Body:"
              cat /tmp/response.json
              break
            fi
          done

      containers:
      - name: buildme
        image: docker.io/opsmx11/dev-buildme-demo:10-nocritical
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
